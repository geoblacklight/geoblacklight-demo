# Use SQLite for development and test. Versions 3.8.0 and up are supported.
# Requires the sqlite3 gem is defined in your Gemfile.
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

# Use PostgreSQL in production.
# Requires the pg gem is defined in your Gemfile.
postgres: &postgres
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("POSTGRES_USER", "geoblacklight") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "geoblacklight") %>

# Use PostgreSQL for Solid Cache, Solid Queue, etc.
production:
  primary:
    <<: *postgres
    database: geoblacklight
  cache:
    <<: *postgres
    database: geoblacklight_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *postgres
    database: geoblacklight_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *postgres
    database: geoblacklight_cable
    migrations_paths: db/cable_migrate
